<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poké Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
html{color-scheme:light}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{
  /* Layout: a chrome frame (header + panels) around a felt play mat; the opponent's side is mirrored above yours. */
  --bg:#efe9dc; --panel:#fffdf8; --panel-2:#f3eee3; --fg:#1f1b16; --muted:#6e675c; --line:#d8d0c0;
  --accent:#f2b705; --accent-fg:#1f1b16; --accent-2:#2a5db0; --accent-2-fg:#ffffff;
  --felt:#3b7a57; --felt-2:#2f6347; --felt-line:rgba(255,255,255,.22); --felt-fg:#f4fff7;
  --danger:#d3372c; --danger-fg:#fff; --ok:#2e9e5b; --warn:#c77d00;
  --shadow:0 2px 10px rgba(30,20,0,.12);
  --display:'Titan One','Arial Black',Impact,sans-serif; --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151922; --panel:#1f2532; --panel-2:#272e3d; --fg:#eef0f4; --muted:#9aa3b5; --line:#343c4c;
  --accent:#f2b705; --accent-fg:#1f1b16; --accent-2:#6d9df0; --accent-2-fg:#0e1420;
  --felt:#2d5f45; --felt-2:#244d38; --felt-line:rgba(255,255,255,.18); --felt-fg:#eaf7ee;
  --danger:#e5574c; --ok:#4cc27a; --warn:#f0a83a; --shadow:0 2px 12px rgba(0,0,0,.4); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#151922; --panel:#1f2532; --panel-2:#272e3d; --fg:#eef0f4; --muted:#9aa3b5; --line:#343c4c;
  --accent:#f2b705; --accent-fg:#1f1b16; --accent-2:#6d9df0; --accent-2-fg:#0e1420;
  --felt:#2d5f45; --felt-2:#244d38; --felt-line:rgba(255,255,255,.18); --felt-fg:#eaf7ee;
  --danger:#e5574c; --ok:#4cc27a; --warn:#f0a83a; --shadow:0 2px 12px rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;line-height:1.2}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:800}
button.sec{background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-2-fg);font-weight:700}
button.dng{color:var(--danger);border-color:var(--danger)}
button.sm{padding:3px 8px;font-size:13px;border-radius:6px}
button.ghost{background:transparent;border-color:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0;max-width:100%}
input[type=number]{width:5.5em;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:22px}
h3{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
[hidden]{display:none!important}

/* header */
#hdr{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
#hdr .logo{font-family:var(--display);font-size:22px;color:var(--fg);display:flex;align-items:center;gap:8px;text-decoration:none}
#hdr .logo i{display:inline-block;width:20px;height:20px;border-radius:50%;background:linear-gradient(to bottom,var(--danger) 0 45%,var(--fg) 45% 55%,#fff 55%);border:2px solid var(--fg)}
#hdr nav{display:flex;gap:4px}
#hdr nav button{border-color:transparent;background:transparent;font-weight:700;color:var(--muted)}
#hdr nav button.on{background:var(--panel-2);color:var(--fg)}
#hdr .who{margin-left:auto;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;font-weight:700}

#main{padding-block:16px;padding-inline:16px;max-width:1280px;margin:0 auto}
#main.wide{max-width:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.notice{background:var(--panel-2);border-left:4px solid var(--warn);padding:10px 14px;border-radius:8px}
.notice.info{border-left-color:var(--accent-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);flex-wrap:wrap}
.item .t{font-weight:800}
.seat{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;background:var(--panel);border:1px dashed var(--line);font-size:13px}
.seat.full{border-style:solid;font-weight:700}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 14px}
.rules-grid label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700}
.rules-grid label.chk{flex-direction:row;align-items:center;gap:8px}
textarea{width:100%;min-height:60px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;z-index:100;font-weight:700;box-shadow:var(--shadow)}

/* cards */
.cd{--s:.5;width:calc(240px*var(--s));height:calc(330px*var(--s));border-radius:calc(11px*var(--s));background-size:calc(2880px*var(--s)) auto;background-position:calc(-240px*var(--x)*var(--s)) calc(-330px*var(--y)*var(--s));background-repeat:no-repeat;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.45);position:relative;background-color:#222}
.cd.back{background:#1b4d9c url(back.webp) center/100% 100% no-repeat}
.cd.click{cursor:pointer;transition:transform .12s}
.cd.click:hover{transform:translateY(-3px)}
.cd.sel{outline:3px solid var(--accent);outline-offset:1px}
.cdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cdgrid .tile{display:flex;flex-direction:column;align-items:center;gap:4px}
.cdgrid .tile .cd{--s:.5;width:100%;height:auto;aspect-ratio:240/330;background-size:calc(1200% ) auto;background-position:calc(var(--x)*100%/11) calc(var(--y)*100%/var(--rows1))}
.cdgrid .tile .nm{font-size:12px;font-weight:700;text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdgrid .tile .ct{display:flex;gap:4px;align-items:center}
.cdgrid .tile .ct b{min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums}
.cd .ban{position:absolute;left:4px;top:4px;background:var(--danger);color:var(--danger-fg);font-size:10px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.cd .ban.lim{background:var(--warn);color:#1f1b16}
.mon .sts span.RTR{background:#333;color:#fff}

/* deck builder */
.builder{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media (max-width:900px){.builder{grid-template-columns:1fr}.builder .deckpane{order:-1}}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.filters .chips{display:flex;flex-wrap:wrap;gap:4px}
.tag{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.tag.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tag.ty{padding-left:6px}
.tag.ty i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.deckpane{position:sticky;top:calc(58px + env(safe-area-inset-top,0px))}
.deckpane .dl{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-top:8px}
.dl .sec{margin-top:8px}
.dl .r{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px}
.dl .r:hover{background:var(--panel-2)}
.dl .r .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.dl .r .c{font-variant-numeric:tabular-nums;font-weight:800;min-width:1.5em;text-align:center}
.dl .r .set{font-size:11px;color:var(--muted)}
.val{font-size:13px;display:flex;flex-direction:column;gap:2px;margin-top:8px}
.val .bad{color:var(--danger)}
.val .good{color:var(--ok)}
.tydot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.35);vertical-align:-1px}

/* table / board */
.tablewrap{display:grid;grid-template-columns:1fr 300px;gap:12px;align-items:start}
@media (max-width:1000px){.tablewrap{grid-template-columns:1fr}.logpane{position:static!important;max-height:40vh}}
.board{background:var(--felt);color:var(--felt-fg);border-radius:16px;padding:12px;box-shadow:inset 0 0 0 2px var(--felt-line),var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.board .side{display:flex;flex-direction:column;gap:8px}
.board .zone-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.board .zlbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-bottom:3px;display:block}
.board .z{display:flex;flex-direction:column;align-items:center;min-width:0}
.board .z .cnt{font-size:12px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.slot{--s:.34;width:calc(240px*var(--s));height:calc(330px*var(--s));border:2px dashed var(--felt-line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;opacity:.9;flex:none}
.slot.big{--s:.42}
.pile{position:relative;cursor:pointer}
.pile .n{position:absolute;inset:auto 4px 4px auto;background:var(--fg);color:var(--bg);border-radius:999px;padding:1px 7px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.bench{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;min-width:0}
.mon{position:relative;flex:none;cursor:pointer}
.mon .cd{--s:.34}
.mon.active .cd{--s:.42}
.mon .dmg{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:999px;min-width:26px;height:26px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:2px solid #fff;font-variant-numeric:tabular-nums;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.mon .hp{position:absolute;left:-4px;top:-8px;background:rgba(0,0,0,.75);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.mon .cdwrap{position:relative}
.mon .attc{position:absolute;left:0}
.mon .attc .cd{box-shadow:0 -1px 3px rgba(0,0,0,.5)}
.mon .poke{position:relative}
.mon .attn{font-size:10px;font-weight:800;text-align:center;opacity:.8;margin-top:3px}
.mon .sts{position:absolute;left:2px;bottom:6px;display:flex;flex-direction:column;gap:2px}
.mon .sts span{background:#fff;color:#111;border-radius:4px;padding:0 4px;font-size:9px;font-weight:900;letter-spacing:.04em;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.mon .sts span.PSN{background:#b04bd6;color:#fff}.mon .sts span.SLP{background:#4b6fd6;color:#fff}.mon .sts span.PAR{background:#f2c200}.mon .sts span.CNF{background:#e8642d;color:#fff}
.mon .att{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:3px;max-width:calc(240px*var(--s) + 20px)}
.mon .att i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.4);display:inline-block;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.mon .att b{background:#fff;color:#222;font-size:10px;padding:0 4px;border-radius:4px;border:1px solid rgba(0,0,0,.3);font-weight:800;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mon .stk{position:absolute;right:-4px;bottom:6px;background:rgba(0,0,0,.75);color:#fff;font-size:10px;font-weight:800;border-radius:4px;padding:0 4px}
.mon .dbtn{position:absolute;left:50%;transform:translateX(-50%);bottom:-8px;display:none;gap:4px;z-index:2}
.mon:hover .dbtn,.mon:focus-within .dbtn{display:flex}
.mon .dbtn button{padding:0 7px;font-size:13px;font-weight:900;border-radius:6px;background:#fff;color:#111;border-color:#888}
.hand{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px;min-width:0}
.hand .cd{--s:.42}
.midbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--felt-line);border-bottom:1px solid var(--felt-line);padding:8px 4px}
.midbar .turn{font-family:var(--display);font-size:18px}
.midbar .turn.mine{color:var(--accent)}
.board button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:var(--felt-fg)}
.board button:hover{background:rgba(255,255,255,.2)}
.board button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.board .pname{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.board .pname .chip{background:rgba(0,0,0,.25);border-color:transparent;color:var(--felt-fg)}
.logpane{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.logpane .entries{overflow:auto;flex:1;display:flex;flex-direction:column;gap:4px;font-size:13px;padding:4px 0}
.logpane .e{padding:3px 6px;border-radius:6px;background:var(--panel-2)}
.logpane .e.chat{background:transparent;border-left:3px solid var(--accent-2);border-radius:0}
.logpane .e b{font-weight:800}
.logpane .e .t{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;margin-left:4px}
.logpane form{display:flex;gap:6px;margin-top:6px}

/* menu / modal */
#menu{position:fixed;z-index:60;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:200px;max-width:min(320px,calc(100vw - 24px));padding:6px;max-height:calc(100vh - 24px);overflow:auto}
#menu .mh{padding:6px 10px;font-weight:800;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px}
#menu button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:7px 10px;border-radius:6px}
#menu button:hover{background:var(--panel-2)}
#menu button.dng{color:var(--danger)}
#menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#modal{background:var(--panel);color:var(--fg);border-radius:14px;max-width:920px;width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
#modal .mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
#modal .mb{padding:14px 16px;overflow:auto}
#modal .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.pickgrid .pk{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:8px;padding:4px}
.pickgrid .pk:hover{background:var(--panel-2)}
.pickgrid .pk.sel{background:var(--accent);color:var(--accent-fg)}
.pickgrid .pk .cd{--s:.42;width:100%;height:auto;aspect-ratio:240/330;background-size:1200% auto;background-position:calc(var(--x)*100%/11) calc(var(--y)*100%/var(--rows1))}
.pickgrid .pk .nm{font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.detail{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media (max-width:640px){.detail{grid-template-columns:1fr}}
.detail .cd{--s:1.25;max-width:100%}
.detail .atk{padding:6px 0;border-top:1px solid var(--line)}
.detail .atk .cost i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.35);margin-right:2px;vertical-align:-1px}
#hover{position:fixed;z-index:70;pointer-events:none;display:none}
#hover .cd{--s:1;box-shadow:0 6px 24px rgba(0,0,0,.5)}
@media (pointer:coarse){#hover{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="hdr">
  <a class="logo" href="#lobby" id="logo"><i></i>Poké Table</a>
  <nav>
    <button data-nav="lobby" id="nav-lobby">Lobby</button>
    <button data-nav="builder" id="nav-builder">Deck builder</button>
    <button data-nav="game" id="nav-game" hidden>Table</button>
  </nav>
  <div class="who">
    <span class="dot" id="online" title="Not connected"></span>
    <button class="chip" id="namebtn" type="button">Set your name</button>
  </div>
</header>
<main id="main"></main>
<div id="hover"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const TYPES=['Grass','Fire','Water','Lightning','Psychic','Fighting','Colorless'];
const TCOL={Grass:'#4caf50',Fire:'#f4511e',Water:'#2196f3',Lightning:'#fdd835',Psychic:'#9c27b0',Fighting:'#a1887f',Colorless:'#e0e0e0'};
const DEFAULT_RULES={deckSize:60,prizes:6,handSize:7,benchSize:5,maxCopies:4,firstTurnAttack:true,autoDraw:true,mulliganDraw:1,colorlessCosts:true,noAttackAfterRetreat:true,unlimitedTrainers:true,conditionsPersist:true,deckOutDamage:true,multiEvolve:true,banned:["Imposter Oak's Revenge",'Lass','Scoop Up','Gust of Wind'],limits:{'Energy Removal':2,'Super Energy Removal':2},notes:''};
const R=r=>Object.assign({},DEFAULT_RULES,r||{});
const STATUS=[['SLP','Asleep'],['CNF','Confused'],['PAR','Paralyzed'],['PSN','Poisoned']];

let DATA=null,CARDS={},SETS=[],SETIDX={};
let uid=null;
const S={screen:'lobby',gameId:null,games:[],decks:[],players:{},game:null,name:'',ready:false,online:false};

/* ---------- data ---------- */
async function loadData(){
  const r=await fetch('cards.json');DATA=await r.json();
  SETS=DATA.sets;SETS.forEach(s=>{s.rows=Math.ceil(s.count/s.cols);SETIDX[s.id]=s});
  DATA.cards.forEach(c=>CARDS[c.id]=c);
}
const C=id=>CARDS[id]||{name:'Unknown card',st:'',sub:'',set:'base1',i:0};
function cardStyle(cid){const c=C(cid);const s=SETIDX[c.set]||{cols:12,rows:1};return `background-image:url(${c.set}.webp);--x:${c.i%s.cols};--y:${Math.floor(c.i/s.cols)};--rows1:${Math.max(1,s.rows-1)}`}
function cardHTML(cid,scale,attrs='',cls=''){return `<div class="cd ${cls}" style="--s:${scale};${cardStyle(cid)}" data-cid="${esc(cid)}" ${attrs} role="img" aria-label="${esc(C(cid).name)}"></div>`}
function backHTML(scale,attrs=''){return `<div class="cd back" style="--s:${scale}" ${attrs}></div>`}
function energyType(c){if(c.st!=='Energy')return null;if(c.types&&c.types[0])return c.types[0];const t=TYPES.find(t=>c.name.startsWith(t));if(t)return t;if(/Colorless/.test(c.name))return 'Colorless';return 'Colorless'}

/* ---------- identity / server ---------- */
const API='api/';
async function api(method,path,body){
  const r=await fetch(API+path,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok&&!(r.status===409&&d&&d.conflict)){const err=new Error((d&&d.message)||('HTTP '+r.status));err.code=(d&&d.error)||r.status;throw err}
  return d;
}
function initIdentity(){uid=ls.get('pid',null);if(!uid||!/^p_[a-z0-9]{8,}$/.test(uid)){uid='p_'+rid()+rid();ls.set('pid',uid)}S.name=ls.get('name','')}
async function savePlayerName(n,quiet){S.name=n;ls.set('name',n);renderHeader();try{await api('PUT','players/'+uid,{data:{name:n,updatedAt:Date.now()}})}catch(e){if(!quiet)toast('Could not save name ('+(e.code||'error')+')')}}
function nameOf(id){if(!id)return 'Empty';if(id===uid&&S.name)return S.name;const p=S.players[id];if(p&&p.name)return p.name;return 'Player'}
let syncTimer=null,syncing=false;const lastSig={};
function syncSoon(ms){clearTimeout(syncTimer);syncTimer=setTimeout(sync,ms||50)}
async function sync(){
  if(syncing){syncSoon(500);return}
  if(document.hidden){syncSoon(15000);return}
  syncing=true;let changed=false;
  try{
    const d=await api('POST','sync',{pid:uid,lobby:S.screen!=='game',game:S.screen==='game'?S.gameId:null,gv:S.game?S.game.version:null});
    if(!S.online){S.online=true;changed=true;setOnline(true)}
    const sig=k=>JSON.stringify(d[k]);
    if(d.players&&sig('players')!==lastSig.players){lastSig.players=sig('players');S.players=d.players;changed=true}
    if(d.decks&&sig('decks')!==lastSig.decks){lastSig.decks=sig('decks');S.decks=d.decks;changed=true}
    if(d.games&&sig('games')!==lastSig.games){lastSig.games=sig('games');S.games=d.games;changed=true}
    if(d.game){
      if(d.game.missing){if(S.screen==='game'){toast('That table was closed');S.gameId=null;S.game=null;go('lobby')}}
      else if(!d.game.unchanged&&(!S.game||S.game.id!==d.game.id||d.game.version!==S.game.version)){S.game=d.game;changed=true}
    }
  }catch(e){if(S.online||!lastSig.tried){S.online=false;setOnline(false);changed=true}lastSig.tried=true}
  finally{syncing=false;if(changed&&S.ready)render();syncSoon(S.screen==='game'?2000:5000)}
}
function setOnline(on){const el=$('#online');el.classList.toggle('on',on);el.title=on?'Connected to the game server':'Cannot reach the game server'}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncSoon(100)});
async function openGame(id){
  S.gameId=id;S.game=null;S.screen='game';ls.set('view',{screen:'game',gameId:id});render();
  try{const d=await api('GET','games/'+id);if(!d||d.missing){toast('That table no longer exists');S.gameId=null;go('lobby');return}if(S.gameId===id){S.game=d;render()}}catch(e){toast('Could not load the table ('+(e.code||'error')+')')}
  syncSoon(2000);
}
function go(screen){S.screen=screen;if(screen!=='game'){ls.set('view',{screen})}closeMenu();closeModal();render();window.scrollTo(0,0);syncSoon(50)}

/* ---------- decks ---------- */
function deckCount(d){return Object.values(d.cards||{}).reduce((a,b)=>a+b,0)}
function validateDeck(d,rules){
  rules=R(rules);const out=[];const n=deckCount(d);
  if(n!==rules.deckSize)out.push({bad:true,m:`${n} of ${rules.deckSize} cards`});else out.push({good:true,m:`${n} cards`});
  const byName={};let basics=0;const banned=rules.banned||[];const limits=rules.limits||{};
  for(const [cid,k] of Object.entries(d.cards||{})){const c=C(cid);if(isBasicLike(c))basics+=k;if(c.st==='Energy'&&c.sub==='Basic')continue;byName[c.name]=(byName[c.name]||0)+k}
  for(const [nm,k] of Object.entries(byName)){
    if(banned.includes(nm)){out.push({bad:true,m:`${nm} is banned`});continue}
    const max=limits[nm]!=null?Math.min(limits[nm],rules.maxCopies):rules.maxCopies;
    if(k>max)out.push({bad:true,m:`${k}× ${nm} (max ${max})`});
  }
  if(!basics)out.push({bad:true,m:'No Basic Pokémon'});
  return out;
}
async function saveDeck(d){
  d.updatedAt=Date.now();d.count=deckCount(d);
  const row={id:d.id,owner:uid,name:d.name,cards:d.cards,count:d.count,updatedAt:d.updatedAt};
  await api('PUT','decks/'+d.id,{data:{owner:uid,name:d.name,cards:d.cards,count:d.count,updatedAt:d.updatedAt}});
  const i=S.decks.findIndex(x=>x.id===d.id);if(i>=0)S.decks[i]=row;else S.decks.push(row);syncSoon(300);
}
async function deleteDeck(id){await api('DELETE','decks/'+id);S.decks=S.decks.filter(x=>x.id!==id);syncSoon(300)}
function deckText(d){const lines=[];const groups={'Pokémon':[],'Trainer':[],'Energy':[]};for(const [cid,k] of Object.entries(d.cards)){const c=C(cid);(groups[c.st]||groups.Trainer).push(`${k} ${c.name} (${cid})`)}for(const g of ['Pokémon','Trainer','Energy']){if(groups[g].length){lines.push('// '+g);lines.push(...groups[g].sort())}}return lines.join('\n')}
function parseDeckText(t){const cards={};const bad=[];t.split(/\r?\n/).forEach(line=>{line=line.trim();if(!line||line.startsWith('//')||line.startsWith('#'))return;const m=line.match(/^(\d+)\s*[x×]?\s+(.*)$/);if(!m){bad.push(line);return}const k=parseInt(m[1],10);let rest=m[2];const idm=rest.match(/\(([a-z0-9]+-\d+)\)/i)||rest.match(/\b([a-z]+\d-\d+)\b/i);let cid=idm?idm[1]:null;if(!cid||!CARDS[cid]){const nm=rest.replace(/\(.*?\)/g,'').trim().toLowerCase();const hit=DATA.cards.find(c=>c.name.toLowerCase()===nm);cid=hit?hit.id:null}if(cid)cards[cid]=(cards[cid]||0)+k;else bad.push(line)});return {cards,bad}}

function canonName(s){s=s.trim().toLowerCase();if(!s)return null;const hit=DATA.cards.find(c=>c.name.toLowerCase()===s)||DATA.cards.find(c=>c.name.toLowerCase().replace(/[^a-z0-9]/g,'')===s.replace(/[^a-z0-9]/g,''));return hit?hit.name:s.trim()}
function readRulesForm(root,prefix='r'){const g=id=>root.querySelector('#'+prefix+'-'+id);const n=(id,d)=>{const v=parseInt(g(id).value,10);return isNaN(v)?d:v};
  const banned=[...new Set(g('banned').value.split(/\r?\n/).map(canonName).filter(Boolean))];
  const limits={};g('limits').value.split(/\r?\n/).forEach(line=>{const m=line.match(/^\s*(.+?)\s*[=:]\s*(\d+)\s*$/);if(m){const nm=canonName(m[1]);if(nm)limits[nm]=parseInt(m[2],10)}});
  return {deckSize:n('deckSize',60),prizes:n('prizes',6),handSize:n('handSize',7),benchSize:n('benchSize',5),maxCopies:n('maxCopies',4),mulliganDraw:n('mulliganDraw',1),firstTurnAttack:g('firstTurnAttack').checked,autoDraw:g('autoDraw').checked,colorlessCosts:g('colorlessCosts').checked,noAttackAfterRetreat:g('noAttackAfterRetreat').checked,unlimitedTrainers:g('unlimitedTrainers').checked,conditionsPersist:g('conditionsPersist').checked,deckOutDamage:g('deckOutDamage').checked,multiEvolve:g('multiEvolve').checked,banned,limits,notes:g('notes').value.trim()}}
function rulesSummary(r){r=R(r);const bits=[`${r.deckSize}-card decks`,`${r.prizes} prizes`,`${r.handSize}-card hand`,`bench ${r.benchSize}`,`max ${r.maxCopies} copies`,r.firstTurnAttack?'turn-1 attacks allowed':'no turn-1 attack',r.autoDraw?'auto-draw':'manual draw'];
  if(r.colorlessCosts)bits.push('energy types ignored (all costs colorless)');if(r.noAttackAfterRetreat)bits.push('no attack after retreating');if(r.unlimitedTrainers)bits.push('unlimited Trainers per turn');if(r.conditionsPersist)bits.push('conditions stay when benched');if(r.deckOutDamage)bits.push('deck-out deals 10 to your Active instead of losing');if(r.multiEvolve)bits.push('multiple evolutions per turn allowed');
  const lim=Object.entries(r.limits||{});if(lim.length)bits.push('limits: '+lim.map(([k,v])=>`${k} ×${v}`).join(', '));if((r.banned||[]).length)bits.push('banned: '+r.banned.join(', '));return bits.join(' · ')}

let debT=null;function debounce(f){clearTimeout(debT);debT=setTimeout(f,180)}

/* ---------- game: state helpers ---------- */
function pushLog(g,m,kind){g.log=g.log||[];g.log.push({t:Date.now(),n:S.name||'',m,k:kind||''});if(g.log.length>150)g.log=g.log.slice(-150)}
function mySeat(g){if(!g||!uid)return null;if(g.seats.a.uid===uid)return 'a';if(g.seats.b.uid===uid)return 'b';return null}
const other=s=>s==='a'?'b':'a';
const P=(g,s)=>g.state.p[s];
const mons=p=>[p.active,...p.bench].filter(Boolean);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const toMon=c=>({id:c.id,c:c.c,dmg:0,st:[],en:[],un:[]});
const monCards=m=>[{id:m.id,c:m.c},...m.un,...m.en];
function findMon(g,pid){for(const s of ['a','b']){const p=P(g,s);for(const m of mons(p))if(m.id===pid)return {m,seat:s,p}}return null}
function removeMon(g,pid){const f=findMon(g,pid);if(!f)return null;if(f.p.active&&f.p.active.id===pid)f.p.active=null;else f.p.bench=f.p.bench.filter(m=>m.id!==pid);return f}
function replaceMon(g,f,nm){if(f.p.active&&f.p.active.id===f.m.id)f.p.active=nm;else{const i=f.p.bench.findIndex(x=>x.id===f.m.id);if(i>=0)f.p.bench[i]=nm}}
function locate(g,iid){for(const s of ['a','b']){const p=P(g,s);for(const z of ['hand','deck','discard','prizes']){const i=p[z].findIndex(c=>c.id===iid);if(i>=0)return {seat:s,zone:z,arr:p[z],idx:i,card:p[z][i]}}
  for(const m of mons(p)){for(const z of ['en','un']){const i=m[z].findIndex(c=>c.id===iid);if(i>=0)return {seat:s,zone:z,arr:m[z],idx:i,card:m[z][i],mon:m}}}}
  if(g.state.stadium&&g.state.stadium.id===iid)return {zone:'stadium',card:g.state.stadium};return null}
function pull(g,iid){const l=locate(g,iid);if(!l)return null;if(l.zone==='stadium'){g.state.stadium=null;return l.card}return l.arr.splice(l.idx,1)[0]}
function who(g,seat){return nameOf(g.seats[seat].uid)}
const nm=c=>C(c.c).name;
function whoDo(){return S.name||'Someone'}
let putChain=Promise.resolve();
function commit(fn){
  if(!S.game)return;const g=clone(S.game);const id=g.id,ver=g.version;delete g.id;delete g.version;
  try{fn(g)}catch(e){console.error(e);toast('That move did not work');return}

/* ---------- game: setup ---------- */
async function startGame(){
  const g=S.game;const r=g.rules;
  const decks={};
  for(const s of ['a','b']){const did=g.seats[s].deckId;if(!did){toast('Both players need a deck');return}
    try{const d=await api('GET','decks/'+did);if(!d||d.missing){toast(`${who(g,s)}'s deck was deleted`);return}decks[s]=d}catch(e){toast('Could not load a deck');return}}
  const first=Math.random()<.5?'a':'b';
  commit(g=>{
    const p={};
    for(const s of ['a','b']){const cards=[];for(const [cid,k] of Object.entries(decks[s].cards||{}))for(let i=0;i<k;i++)cards.push({id:rid(),c:cid});shuffle(cards);
      p[s]={deck:cards,hand:cards.splice(0,Math.min(r.handSize,cards.length)),prizes:cards.splice(0,Math.min(r.prizes,cards.length)),discard:[],active:null,bench:[]}}
    g.state={turn:first,turnNo:1,stadium:null,p,winner:null};g.status='playing';g.startedAt=Date.now();g.log=[];
    pushLog(g,`Game on. Decks shuffled, ${r.handSize} cards dealt, ${r.prizes} prizes set aside.`);

  });

function mulligan(seat){commit(g=>{const p=P(g,seat);const r=g.rules;p.deck.push(...p.hand,...p.prizes);p.hand=[];p.prizes=[];shuffle(p.deck);p.hand=p.deck.splice(0,Math.min(r.handSize,p.deck.length));p.prizes=p.deck.splice(0,Math.min(r.prizes,p.deck.length));pushLog(g,`${who(g,seat)} had no Basic Pokémon and mulliganed (reshuffled, redrew ${r.handSize}, reset prizes).${r.mulliganDraw?` ${who(g,other(seat))} may draw ${r.mulliganDraw} extra card${r.mulliganDraw>1?'s':''}.`:''}`)})}

  };
  const chatNew=main.querySelector('#chatin');if(chatNew&&chatPrev){chatNew.value=chatPrev;if(chatFocus){chatNew.focus();try{chatNew.setSelectionRange(chatPrev.length,chatPrev.length)}catch(e){}}}
  const chat=main.querySelector('#chat');if(chat)chat.onsubmit=e=>{e.preventDefault();const i=chat.querySelector('#chatin');const v=i.value.trim();if(!v)return;i.value='';commit(g=>pushLog(g,v,'chat'))};
}
function monHTML(m,seat,active,canTouch){const c=C(m.c);const hp=c.hp;const sc=active?.42:.34;
  const step=Math.round(330*sc*0.13);const n=m.en.length;
  const stack=m.en.map((x,i)=>`<div class="attc" style="top:${i*step}px;z-index:${i+1}">${cardHTML(x.c,sc)}</div>`).join('');
  return `<div class="mon ${active?'active':''}" data-mon="${m.id}" tabindex="0"><div class="cdwrap" style="padding-top:${n*step}px">${stack}<div class="poke" style="z-index:${n+1}">${cardHTML(m.c,sc)}${hp?`<span class="hp">${Math.max(0,hp-m.dmg)}/${hp}</span>`:''}${m.dmg?`<span class="dmg">${m.dmg}</span>`:''}${m.st.length?`<div class="sts">${m.st.map(s=>`<span class="${s}">${s}</span>`).join('')}</div>`:''}${m.un.length?`<span class="stk">+${m.un.length} under</span>`:''}${canTouch?`<div class="dbtn"><button type="button" data-d="-${m.id}" title="Remove 10 damage">−</button><button type="button" data-d="+${m.id}" title="Add 10 damage">+</button></div>`:''}</div></div>${n?`<div class="attn">${n} attached</div>`:''}</div>`}

function renderSetup(main,g){
  const my=mySeat(g);const host=g.host===uid;const both=g.seats.a.uid&&g.seats.b.uid;const ready=both&&g.seats.a.deckId&&g.seats.b.deckId;
  const seatHTML=s=>{const st=g.seats[s];const mine=st.uid===uid;return `<div class="panel"><div class="lbl">Seat ${s.toUpperCase()}</div><h3>${esc(nameOf(st.uid))}${mine?' (you)':''}</h3>
    ${st.uid?`<p class="small">Deck: <b>${st.deckName?esc(st.deckName):'not chosen'}</b></p>`:`<p class="small muted">Open seat</p>`}
    ${mine?`<div class="row"><select id="deck-${s}"><option value="">Choose a deck…</option>${S.decks.map(d=>{const bad=validateDeck(d,g.rules).filter(x=>x.bad);return `<option value="${d.id}" ${d.id===st.deckId?'selected':''}>${esc(d.name)} (${deckCount(d)})${bad.length?' · '+esc(bad[0].m):''}</option>`}).join('')}</select><button class="sm" type="button" data-leave="${s}">Leave seat</button></div>`:(!st.uid&&uid&&!my?`<button class="pri" type="button" data-sit="${s}">Take this seat</button>`:'')}
  </div>`};
  main.innerHTML=`<div style="max-width:900px;margin:0 auto" class="stack">
    <div class="row"><h2 class="grow">${esc(g.name)}</h2><span class="muted small">host ${esc(nameOf(g.host))}</span></div>
    <div class="grid2">${seatHTML('a')}${seatHTML('b')}</div>
    <div class="panel"><div class="row"><h3 class="grow">Rules</h3>${host?`<button class="sm" type="button" id="editrules">Edit</button>`:''}</div><p class="small">${esc(rulesSummary(g.rules))}</p>${g.rules.notes?`<div class="notice info small" style="white-space:pre-wrap">${esc(g.rules.notes)}</div>`:''}</div>
    <div class="row">${host?`<button class="pri" type="button" id="start" ${ready?'':'disabled'}>Start game</button><span class="small muted">${ready?'Shuffles both decks, deals hands and prizes, flips for who goes first.':both?'Waiting for both decks.':'Waiting for a second player.'}</span>`:`<span class="muted small">${ready?'Waiting for the host to start.':'Waiting for everyone to pick a deck.'}</span>`}<span class="grow"></span><button type="button" id="back">Back to lobby</button></div>
  </div>`;
  main.onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='back')go('lobby');
    else if(b.id==='start')startGame();
    else if(b.dataset.sit)commit(g=>{g.seats[b.dataset.sit]={uid,deckId:null,deckName:null};pushLog(g,`${whoDo()} sat down`)});
    else if(b.dataset.leave)commit(g=>{g.seats[b.dataset.leave]={uid:null,deckId:null,deckName:null};pushLog(g,`${whoDo()} left the seat`)});
    else if(b.id==='editrules')showModal('Edit rules',rulesForm(g.rules),`<button class="pri" id="rok" type="button">Save rules</button>`,m=>{m.querySelector('#rok').onclick=()=>{const r=readRulesForm(m);closeModal();commit(g=>{g.rules=r;pushLog(g,`${whoDo()} changed the rules: ${rulesSummary(r)}`)})}});
  };
  main.querySelectorAll('select[id^=deck-]').forEach(sel=>sel.onchange=()=>{const s=sel.id.slice(5);const d=S.decks.find(x=>x.id===sel.value);commit(g=>{g.seats[s].deckId=d?d.id:null;g.seats[s].deckName=d?d.name:null;if(d)pushLog(g,`${whoDo()} chose the deck "${d.name}"`)})});
}

/* ---------- game: menus ---------- */
function namesOf(sel,opts){return sel.map(id=>{const o=opts.find(o=>o.key===id);return o?C(o.cid).name:'?'}).join(', ')}
function pickMon(g,seats,title,cb,filter){
  const opts=[];for(const s of seats){for(const m of mons(P(g,s))){if(filter&&!filter(m,s))continue;opts.push({key:m.id,cid:m.c,label:`${nm(m)}${m.dmg?' · '+m.dmg+' dmg':''}`,sub:seats.length>1?who(g,s):''})}}
  if(!opts.length){toast('No Pokémon in play to choose');return}
  pickModal(title,opts,false,[{label:'Choose',fn:sel=>cb(sel[0])}],true);
}
function pickModal(title,opts,multi,actions,immediate){
  const sel=new Set();
  showModal(title,`<div class="pickgrid">${opts.map(o=>`<div class="pk" data-key="${esc(o.key)}"><div class="cd" style="${cardStyle(o.cid)}" data-cid="${esc(o.cid)}" role="img" aria-label="${esc(C(o.cid).name)}"></div><div class="nm">${esc(o.label)}</div>${o.sub?`<div class="small muted">${esc(o.sub)}</div>`:''}</div>`).join('')||'<p class="muted">Nothing here.</p>'}</div>`,
    actions.map((a,i)=>`<button type="button" class="${i?'':'pri'}" data-a="${i}">${esc(a.label)}</button>`).join('')+(multi?'<span class="small muted" id="selcount"></span>':''),
    m=>{m.querySelectorAll('.pk').forEach(el=>el.onclick=()=>{const k=el.dataset.key;if(immediate){closeModal();actions[0].fn([k]);return}if(multi){if(sel.has(k))sel.delete(k);else sel.add(k)}else{sel.clear();sel.add(k)}m.querySelectorAll('.pk').forEach(x=>x.classList.toggle('sel',sel.has(x.dataset.key)));const sc=m.querySelector('#selcount');if(sc)sc.textContent=sel.size?sel.size+' selected':''});
      m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(!sel.size&&!immediate){toast('Pick a card first');return}closeModal();actions[+b.dataset.a].fn([...sel])})});
}
function handMenu(g,seat,iid,anchor){
  const l=locate(g,iid);if(!l)return;const card=l.card;const c=C(card.c);const p=P(g,seat);const me=whoDo();
  const items=[{label:'View card',fn:()=>viewCard(card.c)},{sep:true}];
  if(isBasicLike(c)){
    if(!p.active)items.push({label:'Play as Active Pokémon',fn:()=>commit(g=>{const cd=pull(g,iid);P(g,seat).active=toMon(cd);pushLog(g,`${me} played ${c.name} as Active`)})});
    items.push({label:'Put on Bench',fn:()=>commit(g=>{const p=P(g,seat);if(p.bench.length>=g.rules.benchSize){toast('Bench is full (house rule: '+g.rules.benchSize+')');return}const cd=pull(g,iid);p.bench.push(toMon(cd));pushLog(g,`${me} benched ${c.name}`)})});
  }
  if(c.st==='Pokémon'&&c.sub!=='Basic')items.push({label:'Evolve a Pokémon…',fn:()=>pickMon(g,[seat],`Evolve which Pokémon into ${c.name}?`,pid=>commit(g=>{const f=findMon(g,pid);const cd=pull(g,iid);if(!f||!cd)return;const nmn={id:cd.id,c:cd.c,dmg:f.m.dmg,st:[],en:f.m.en,un:[{id:f.m.id,c:f.m.c},...f.m.un]};replaceMon(g,f,nmn);pushLog(g,`${me} evolved ${nm(f.m)} into ${c.name}`)}),(m)=>true)});
  if(c.st==='Energy')items.push({label:'Attach to a Pokémon…',fn:()=>pickMon(g,[seat],`Attach ${c.name} to…`,pid=>commit(g=>{const f=findMon(g,pid);const cd=pull(g,iid);if(!f||!cd)return;f.m.en.push(cd);pushLog(g,`${me} attached ${c.name} to ${nm(f.m)}`)}))});
  if(c.st==='Trainer'){
    items.push({label:'Play Trainer (then discard)',fn:()=>commit(g=>{const cd=pull(g,iid);P(g,seat).discard.push(cd);pushLog(g,`${me} played ${c.name}`)})});
    if(c.sub==='Stadium')items.push({label:'Play as Stadium',fn:()=>commit(g=>{const cd=pull(g,iid);const old=g.state.stadium;if(old)P(g,old.owner||seat).discard.push({id:old.id,c:old.c});g.state.stadium={id:cd.id,c:cd.c,owner:seat};pushLog(g,`${me} played the stadium ${c.name}${old?' (replacing '+nm(old)+')':''}`)})});
    items.push({label:'Attach to a Pokémon…',fn:()=>pickMon(g,[seat,other(seat)],`Attach ${c.name} to…`,pid=>commit(g=>{const f=findMon(g,pid);const cd=pull(g,iid);if(!f||!cd)return;f.m.en.push(cd);pushLog(g,`${me} attached ${c.name} to ${who(g,f.seat)}'s ${nm(f.m)}`)}))});
  }
  items.push({sep:true},
    {label:'Discard',fn:()=>commit(g=>{const cd=pull(g,iid);P(g,seat).discard.push(cd);pushLog(g,`${me} discarded ${c.name}`)})},
    {label:'Put on top of deck',fn:()=>commit(g=>{const cd=pull(g,iid);P(g,seat).deck.unshift(cd);pushLog(g,`${me} put a card from hand on top of the deck`)})},
    {label:'Put on bottom of deck',fn:()=>commit(g=>{const cd=pull(g,iid);P(g,seat).deck.push(cd);pushLog(g,`${me} put a card from hand on the bottom of the deck`)})},
    {label:'Shuffle into deck',fn:()=>commit(g=>{const cd=pull(g,iid);const p=P(g,seat);p.deck.push(cd);shuffle(p.deck);pushLog(g,`${me} shuffled a card from hand into the deck`)})},
    {label:'Show to opponent',fn:()=>commit(g=>pushLog(g,`${me} shows ${c.name} from hand`))});
  showMenu(items,anchor,c.name);
}
function monMenu(g,seat,pid,anchor){
  const f=findMon(g,pid);if(!f)return;const m=f.m;const own=f.seat===seat;const me=whoDo();const owner=who(g,f.seat);const c=C(m.c);
  const items=[{label:'View card',fn:()=>viewCard(m.c)},{label:'Set damage…',fn:()=>askNumber(`Damage on ${c.name}`,m.dmg,v=>commit(g=>{const f=findMon(g,pid);if(!f)return;f.m.dmg=Math.max(0,Math.round(v/10)*10);pushLog(g,`${me} set ${owner}'s ${c.name} to ${f.m.dmg} damage`)}))},{sep:true}];
  STATUS.forEach(([code,label])=>items.push({label:(m.st.includes(code)?'✓ ':'')+label,fn:()=>commit(g=>{const f=findMon(g,pid);if(!f)return;const has=f.m.st.includes(code);if(has)f.m.st=f.m.st.filter(x=>x!==code);else{if(code!=='PSN')f.m.st=f.m.st.filter(x=>x==='PSN');f.m.st.push(code)}pushLog(g,`${owner}'s ${c.name} is ${has?'no longer':'now'} ${label}`)})}));
  if(m.st.length)items.push({label:'Clear all conditions',fn:()=>commit(g=>{const f=findMon(g,pid);if(!f)return;f.m.st=[];pushLog(g,`${owner}'s ${c.name} recovered from all special conditions`)})});
  if(!own){items.push({sep:true});if(m.en.length)items.push({label:'Discard an attached card… (Energy Removal)',fn:()=>attachedMenu(g,f.seat,pid,true)});
    items.push({label:'Knocked Out (everything to their discard)',danger:true,fn:()=>commit(g=>{const r=removeMon(g,pid);if(!r)return;P(g,r.seat).discard.push(...monCards(r.m));pushLog(g,`${owner}'s ${c.name} was Knocked Out (marked by ${whoDo()}). ${owner} takes a prize.`)})});}
  if(own){
    items.push({sep:true});
    const isActive=f.p.active&&f.p.active.id===pid;
    const doSwitch=(g,benchId)=>{const p=P(g,seat);const i=p.bench.findIndex(x=>x.id===benchId);if(i<0||!p.active)return;const old=p.active;if(!R(g.rules).conditionsPersist)old.st=[];else old.st=old.st.filter(x=>x!=='RTR');p.active=p.bench[i];p.bench[i]=old;let note='';if(R(g.rules).noAttackAfterRetreat){if(!p.active.st.includes('RTR'))p.active.st.push('RTR');note=' (house rule: no attack this turn)'}pushLog(g,`${me} switched ${nm(old)} out for ${nm(p.active)}${note}`)};
    if(isActive)items.push({label:'Retreat: switch with a benched Pokémon…',fn:()=>pickMon(g,[seat],'Switch with…',bid=>commit(g=>doSwitch(g,bid)),(x)=>x.id!==pid)});
    else if(f.p.active)items.push({label:'Switch with the Active Pokémon',fn:()=>commit(g=>doSwitch(g,pid))});
    else items.push({label:'Move to Active',fn:()=>commit(g=>{const p=P(g,seat);const i=p.bench.findIndex(x=>x.id===pid);if(i<0)return;p.active=p.bench.splice(i,1)[0];pushLog(g,`${me} moved ${c.name} to Active`)})});
    if(m.en.length)items.push({label:'Move or discard an attached card…',fn:()=>attachedMenu(g,seat,pid)});
    if(m.un.length)items.push({label:'Devolve (top card to hand)',fn:()=>devolve(seat,pid,'hand')},{label:'Devolve (top card to discard)',fn:()=>devolve(seat,pid,'discard')});
    items.push({sep:true},
      {label:'Knocked Out (everything to discard)',danger:true,fn:()=>commit(g=>{const f=removeMon(g,pid);if(!f)return;P(g,seat).discard.push(...monCards(f.m));pushLog(g,`${owner}'s ${c.name} was Knocked Out`)})},
      {label:'Return everything to hand',fn:()=>commit(g=>{const f=removeMon(g,pid);if(!f)return;P(g,seat).hand.push(...monCards(f.m));pushLog(g,`${me} returned ${c.name} and its cards to hand`)})},
      {label:'Shuffle everything into deck',fn:()=>commit(g=>{const f=removeMon(g,pid);if(!f)return;const p=P(g,seat);p.deck.push(...monCards(f.m));shuffle(p.deck);pushLog(g,`${me} shuffled ${c.name} and its cards into the deck`)})});
  }
  showMenu(items,anchor,`${owner}'s ${c.name}`);
}
function devolve(seat,pid,dest){commit(g=>{const f=findMon(g,pid);if(!f||!f.m.un.length)return;const m=f.m;const prev=m.un.shift();const self={id:m.id,c:m.c};const nmn={id:prev.id,c:prev.c,dmg:m.dmg,st:[],en:m.en,un:m.un};replaceMon(g,f,nmn);P(g,seat)[dest].push(self);pushLog(g,`${whoDo()} devolved ${nm(self)} back to ${nm(prev)} (${nm(self)} to ${dest})`)})}
function attachedMenu(g,seat,pid,oppMode){
  const f=findMon(g,pid);if(!f)return;const opts=f.m.en.map(x=>({key:x.id,cid:x.c,label:nm(x)}));
  const discardAct={label:'Discard',fn:sel=>commit(g=>{const p=P(g,seat);let n=0;sel.forEach(id=>{const cd=pull(g,id);if(cd){p.discard.push(cd);n++}});pushLog(g,`${whoDo()} discarded ${namesOf(sel,opts)} from ${who(g,seat)}'s ${nm(f.m)}`)})};
  if(oppMode){pickModal(`Attached to ${who(g,seat)}'s ${nm(f.m)}`,opts,true,[discardAct]);return}
  pickModal(`Attached to ${nm(f.m)}`,opts,true,[
    discardAct,
    {label:'To hand',fn:sel=>commit(g=>{const p=P(g,seat);sel.forEach(id=>{const cd=pull(g,id);if(cd)p.hand.push(cd)});pushLog(g,`${whoDo()} returned ${sel.length} attached card${sel.length===1?'':'s'} from ${nm(f.m)} to hand`)})},
    {label:'Move to another Pokémon…',fn:sel=>pickMon(g,[seat],'Move to…',tid=>commit(g=>{const t=findMon(g,tid);if(!t)return;sel.forEach(id=>{const cd=pull(g,id);if(cd)t.m.en.push(cd)});pushLog(g,`${whoDo()} moved ${sel.length} card${sel.length===1?'':'s'} from ${nm(f.m)} to ${nm(t.m)}`)}),x=>x.id!==pid)}
  ]);
}
function deckMenu(g,seat,anchor){
  const p=P(g,seat);const me=whoDo();
  const draw=n=>commit(g=>{const p=P(g,seat);const k=Math.min(n,p.deck.length);p.hand.push(...p.deck.splice(0,k));pushLog(g,`${me} drew ${k} card${k===1?'':'s'}${k<n?' (deck ran out)':''}`)});
  const items=[{label:'Draw 1',fn:()=>draw(1)},{label:'Draw 2',fn:()=>draw(2)},{label:'Draw…',fn:()=>askNumber('Draw how many?',7,draw)},{sep:true},
    {label:'Shuffle deck',fn:()=>commit(g=>{shuffle(P(g,seat).deck);pushLog(g,`${me} shuffled the deck`)})},
    {label:'Search deck…',fn:()=>searchDeck(g,seat)},
    {label:'Look at top cards…',fn:()=>askNumber('Look at how many from the top?',3,n=>lookTop(g,seat,n))},
    {sep:true},
    {label:'Discard top card',fn:()=>commit(g=>{const p=P(g,seat);const cd=p.deck.shift();if(!cd)return;p.discard.push(cd);pushLog(g,`${me} discarded ${nm(cd)} from the top of the deck`)})},
    {label:'Reveal top card',fn:()=>commit(g=>{const p=P(g,seat);if(!p.deck.length)return;pushLog(g,`${me} reveals the top card: ${nm(p.deck[0])}`)})}];
  if(!mons(p).length)items.push({sep:true},{label:'Mulligan (no Basic Pokémon in hand)',fn:()=>mulligan(seat)});
  showMenu(items,anchor,`Deck · ${p.deck.length} cards`);
}
function searchDeck(g,seat){
  const p=P(g,seat);const opts=p.deck.slice().sort((a,b)=>nm(a).localeCompare(nm(b))).map(x=>({key:x.id,cid:x.c,label:nm(x)}));
  const after=(g,n,what)=>{shuffle(P(g,seat).deck);pushLog(g,`${whoDo()} searched the deck for ${n} card${n===1?'':'s'} (${what}) and shuffled`)};
  pickModal('Search your deck (shown alphabetically)',opts,true,[
    {label:'To hand',fn:sel=>commit(g=>{const p=P(g,seat);sel.forEach(id=>{const cd=pull(g,id);if(cd)p.hand.push(cd)});after(g,sel.length,'to hand')})},
    {label:'To bench',fn:sel=>commit(g=>{const p=P(g,seat);sel.forEach(id=>{const cd=pull(g,id);if(cd)p.bench.push(toMon(cd))});after(g,sel.length,namesOf(sel,opts)+' to bench')})},
    {label:'To discard',fn:sel=>commit(g=>{const p=P(g,seat);sel.forEach(id=>{const cd=pull(g,id);if(cd)p.discard.push(cd)});after(g,sel.length,'to discard')})},
    {label:'Just shuffle',fn:()=>commit(g=>{shuffle(P(g,seat).deck);pushLog(g,`${whoDo()} looked through the deck and shuffled`)})}
  ]);
}
function lookTop(g,seat,n){
  const p=P(g,seat);const top=p.deck.slice(0,n);const opts=top.map((x,i)=>({key:x.id,cid:x.c,label:`${i+1}. ${nm(x)}`}));
  commit(g=>pushLog(g,`${whoDo()} looked at the top ${top.length} card${top.length===1?'':'s'} of the deck`));
  pickModal(`Top ${top.length} of your deck (in order)`,opts,true,[
    {label:'Selected to hand',fn:sel=>commit(g=>{const p=P(g,seat);sel.forEach(id=>{const cd=pull(g,id);if(cd)p.hand.push(cd)});pushLog(g,`${whoDo()} took ${sel.length} of those to hand`)})},
    {label:'Selected to discard',fn:sel=>commit(g=>{const p=P(g,seat);sel.forEach(id=>{const cd=pull(g,id);if(cd)p.discard.push(cd)});pushLog(g,`${whoDo()} discarded ${sel.length} of those`)})},
    {label:'Selected to bottom',fn:sel=>commit(g=>{const p=P(g,seat);sel.forEach(id=>{const cd=pull(g,id);if(cd)p.deck.push(cd)});pushLog(g,`${whoDo()} put ${sel.length} of those on the bottom`)})},
    {label:'Leave as is',fn:()=>{}}
  ]);
}
function viewDiscard(g,seat,own){
  const p=P(g,seat);const opts=p.discard.slice().reverse().map(x=>({key:x.id,cid:x.c,label:nm(x)}));
  const actions=own?[
    {label:'To hand',fn:sel=>commit(g=>{const p=P(g,seat);sel.forEach(id=>{const cd=pull(g,id);if(cd)p.hand.push(cd)});pushLog(g,`${whoDo()} took ${namesOf(sel,opts)} from the discard pile to hand`)})},
    {label:'Shuffle into deck',fn:sel=>commit(g=>{const p=P(g,seat);sel.forEach(id=>{const cd=pull(g,id);if(cd)p.deck.push(cd)});shuffle(p.deck);pushLog(g,`${whoDo()} shuffled ${sel.length} card${sel.length===1?'':'s'} from the discard pile into the deck`)})},
    {label:'To top of deck',fn:sel=>commit(g=>{const p=P(g,seat);sel.forEach(id=>{const cd=pull(g,id);if(cd)p.deck.unshift(cd)});pushLog(g,`${whoDo()} put ${sel.length} card${sel.length===1?'':'s'} from the discard pile on top of the deck`)})},
    {label:'To bench',fn:sel=>commit(g=>{const p=P(g,seat);sel.forEach(id=>{const cd=pull(g,id);if(cd)p.bench.push(toMon(cd))});pushLog(g,`${whoDo()} put ${sel.length} card${sel.length===1?'':'s'} from the discard pile onto the bench`)})}
  ]:[{label:'Close',fn:()=>{}}];
  pickModal(`${who(g,seat)}'s discard pile · ${p.discard.length}`,opts,own,actions);
}
function coinMenu(anchor){
  const flip=n=>commit(g=>{const r=[];for(let i=0;i<n;i++)r.push(Math.random()<.5?'Heads':'Tails');const heads=r.filter(x=>x==='Heads').length;pushLog(g,n===1?`${whoDo()} flipped a coin: ${r[0]}`:`${whoDo()} flipped ${n} coins: ${r.join(', ')} (${heads} heads)`)});
  showMenu([{label:'Flip 1 coin',fn:()=>flip(1)},{label:'Flip 2 coins',fn:()=>flip(2)},{label:'Flip 3 coins',fn:()=>flip(3)},{label:'Flip…',fn:()=>askNumber('How many coins?',4,flip)}],anchor,'Coin');
}
function endTurn(){commit(g=>{const s=g.state;const from=s.turn;const to=other(from);s.turn=to;s.turnNo++;let extra='';for(const sd of ['a','b'])for(const m of mons(P(g,sd)))m.st=m.st.filter(x=>x!=='RTR');if(g.rules.autoDraw){const p=P(g,to);const cd=p.deck.shift();if(cd){p.hand.push(cd);extra=` ${who(g,to)} drew a card.`}else if(R(g.rules).deckOutDamage&&p.active){p.active.dmg+=10;extra=` ${who(g,to)} has no cards to draw: 10 damage on ${nm(p.active)} (now ${p.active.dmg}).`}else extra=` ${who(g,to)} has no cards left to draw.`}pushLog(g,`${who(g,from)} ended the turn. Turn ${s.turnNo}: ${who(g,to)}.${extra}`)})}
function moreMenu(anchor){
  const g=S.game;const my=mySeat(g);const host=g.host===uid;
  const items=[
    {label:'Roll a die (1–6)',fn:()=>commit(g=>pushLog(g,`${whoDo()} rolled a die: ${1+Math.floor(Math.random()*6)}`))},
    {label:"It's my turn (fix turn order)",fn:()=>commit(g=>{g.state.turn=my;pushLog(g,`${whoDo()} took the turn`)})},
    {sep:true},
    {label:'I win this game',fn:()=>commit(g=>{g.state.winner=my;g.status='done';pushLog(g,`${who(g,my)} wins the game`)})},
    {label:'I concede',danger:true,fn:()=>commit(g=>{g.state.winner=other(my);g.status='done';pushLog(g,`${who(g,my)} conceded. ${who(g,other(my))} wins.`)})},
    {sep:true},
    {label:'Back to lobby (table stays open)',fn:()=>go('lobby')}];
  if(host||g.status==='done')items.push({label:g.status==='done'?'Play again (back to setup)':'Reset table to setup',danger:g.status!=='done',fn:()=>showModal('Reset this table?',`<p>The current game is thrown away. Seats and decks are kept.</p>`,`<button class="dng" id="rok" type="button">Reset</button>`,m=>{m.querySelector('#rok').onclick=()=>{closeModal();commit(g=>{g.state=null;g.status='lobby';pushLog(g,`${whoDo()} reset the table`)})}})});
  showMenu(items,anchor,'More');
}

/* ---------- boot ---------- */
async function start(){
  try{await loadData()}catch(e){$('#main').innerHTML='<div class="panel"><b>Could not load the card database.</b> Reload the page to try again.</div>';return}
  initIdentity();S.ready=true;renderHeader();
  const v=ls.get('view',{screen:'lobby'});
  if(v.screen==='game'&&v.gameId)openGame(v.gameId);else if(v.screen==='builder')go('builder');else go('lobby');
  if(S.name)savePlayerName(S.name,true);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeModal()}});
start();
})();
</script>
